name: Publish verified Android 3.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-30.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nama19920-glitch/luka-android-releases
    steps:
      - name: Materialize validated release assets
        env:
          APK_CHUNKS: 'a1348fb6c4851a7f04bd24912e557a87bf76c6e8 44a5f68bc93b708d6ad51871bd7bec3a747b9cca 2b1b54b92e3d305ace0bb3d6bea09852d3fcae98 05abeac80664d9941b9236841d928d73d60bfec5 6197666a221016c23756187ec2b749167910b769 860f5477113ef69d8e9ecdca410ac2926bde3c37 f0e422024b81d68d5128407b7b37a7a702b0c0c2'
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name | grep -Fx android-v2.6.35
          mkdir -p dist
          for blob in $APK_CHUNKS; do
            gh api "repos/$GH_REPO/git/blobs/$blob" --jq .content | base64 --decode >> dist/Luka-3.0-Android.apk
          done
          python - <<'PY'
          import hashlib,json,pathlib
          expected={"packageName":"com.sk7.lukacompanion","version":"3.0","versionCode":313,"url":"https://github.com/nama19920-glitch/luka-android-releases/releases/download/android-v3.0/Luka-3.0-Android.apk","sha256":"99b1e4434b411d9d6958ceea1822599675780a62d066393e6a9e8bb3dafe30e9","sizeBytes":3338793,"notes":"تحديث جديد لتطبيق Luka ✦\n\n🛍️ تم تحسين عرض متجر العناصر ومتجر طور الزومبي.\n📅 تم إصلاح تسجيل الدخول اليومي ليصبح تلقائياً، مع عرض مهامك.\n👥 تم ترتيب قائمة الحسابات: إضافة، تغيير وحذف.\n🎁 تم تحسين قائمة الإهداء للأصدقاء وإظهار آيديات السوني والإكس بوكس.\n🔧 تم إصلاح ومعالجة مشاكل تحميل المتجر.\n\nحدّث التطبيق واستمتع بالتغييرات 🚀"}
          apk=pathlib.Path('dist/Luka-3.0-Android.apk')
          assert apk.stat().st_size==expected['sizeBytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected['sha256']
          assert expected['packageName']=='com.sk7.lukacompanion' and expected['versionCode']==313 and expected['version']=='3.0'
          pathlib.Path('dist/android-update.json').write_text(json.dumps(expected,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('dist/SHA256SUMS.txt').write_text(expected['sha256']+'  Luka-3.0-Android.apk\n')
          pathlib.Path('release-notes.txt').write_text(expected['notes']+'\n\nنفس توقيع النسخة العامة الحالية. ثبّت التحديث فوق النسخة الحالية دون حذف التطبيق.\nفحوص البيانات والواجهة والبناء والتشغيل على أندرويد 14 ناجحة.\n')
          PY
      - name: Upload draft and verify every asset before publication
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/android-v3.0" > existing-release.json 2>/dev/null; then
            python - <<'PY'
          import json
          release=json.load(open('existing-release.json'))
          assert release['draft'], 'Release is already public; no existing public assets will be overwritten'
          PY
          else
            gh release create android-v3.0 --draft --target "$GITHUB_SHA" --title 'Luka Companion 3.0 — Android' --notes-file release-notes.txt
          fi
          gh release upload android-v3.0 dist/Luka-3.0-Android.apk dist/android-update.json dist/SHA256SUMS.txt --clobber
          mkdir -p verified
          gh release download android-v3.0 --dir verified
          python - <<'PY'
          import hashlib,json,pathlib
          for name in ['Luka-3.0-Android.apk','android-update.json','SHA256SUMS.txt']:
              assert pathlib.Path('dist',name).read_bytes()==pathlib.Path('verified',name).read_bytes(),name
          feed=json.loads(pathlib.Path('verified/android-update.json').read_text())
          assert hashlib.sha256(pathlib.Path('verified/Luka-3.0-Android.apk').read_bytes()).hexdigest()==feed['sha256']
          print('Draft APK, manifest and checksum exactly match validated files.')
          PY
      - name: Publish release and select it as latest
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name | grep -Fx android-v2.6.35
          gh release edit android-v3.0 --draft=false --prerelease=false --latest --notes-file release-notes.txt
      - name: Verify anonymous update feed and APK download
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          expected=json.loads(pathlib.Path('dist/android-update.json').read_text())
          url='https://github.com/nama19920-glitch/luka-android-releases/releases/latest/download/android-update.json'
          for attempt in range(8):
              try:
                  request=urllib.request.Request(url+'?verify=30-'+str(time.time_ns()),headers={'User-Agent':'Luka-Android/2.6.35','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)
                  if actual==expected: break
              except Exception:
                  if attempt==7: raise
              if attempt==7: raise AssertionError('Public feed does not match the new release')
              time.sleep(5)
          with urllib.request.urlopen(actual['url'],timeout=60) as response: apk=response.read()
          assert len(apk)==actual['sizeBytes'] and hashlib.sha256(apk).hexdigest()==actual['sha256']
          print('Public version 3.0 (313) is available anonymously; latest update feed and APK agree.')
          PY
