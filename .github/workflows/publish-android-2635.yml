name: Publish verified Android 2.6.35
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-2635.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nama19920-glitch/luka-android-releases
    steps:
      - name: Materialize validated release assets
        env:
          APK_BLOB: 5bbea55ae8ac14ffcfa9eb28cd244bb67c5283d4
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name | grep -Fx android-v2.6.33
          mkdir -p dist
          gh api "repos/$GH_REPO/git/blobs/$APK_BLOB" --jq .content | base64 --decode > dist/Luka-2.6.35-Android.apk
          python - <<'PY'
          import hashlib,json,pathlib
          expected={"packageName":"com.sk7.lukacompanion","version":"2.6.35","versionCode":306,"url":"https://github.com/nama19920-glitch/luka-android-releases/releases/download/android-v2.6.35/Luka-2.6.35-Android.apk","sha256":"394f8c9c0d35f102d6a5ea85c60302ff59c89b7d4c643cc00fb9bff2a887eafb","sizeBytes":3256001,"notes":"تنبيهات المهمات اليومية مع الباور الصحيح وعلامات الماب وندرة المكافآت. إشعار عند تجدد التنبيهات. تحديث تلقائي للمتجر وزر تحديث الفيبوكس، ورصيد أزرق ثابت أثناء التصفح. شاشة انتظار متحركة وأيقونات خاصة، وتحسين تغيير اللغة وحالة عدم وجود مهام."}
          apk=pathlib.Path('dist/Luka-2.6.35-Android.apk')
          assert apk.stat().st_size==expected['sizeBytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected['sha256']
          assert expected['packageName']=='com.sk7.lukacompanion' and expected['versionCode']==306 and expected['version']=='2.6.35'
          pathlib.Path('dist/android-update.json').write_text(json.dumps(expected,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('dist/SHA256SUMS.txt').write_text(expected['sha256']+'  Luka-2.6.35-Android.apk\n')
          pathlib.Path('release-notes.txt').write_text(expected['notes']+'\n\nنفس توقيع النسخة العامة الحالية. ثبّت التحديث فوق النسخة الحالية دون حذف التطبيق.\nفحوص البيانات والواجهة والبناء والتشغيل على أندرويد 14 ناجحة.\n')
          PY
      - name: Upload draft and verify every asset before publication
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/android-v2.6.35" > existing-release.json 2>/dev/null; then
            python - <<'PY'
          import json
          release=json.load(open('existing-release.json'))
          assert release['draft'], 'Release is already public; no existing public assets will be overwritten'
          PY
          else
            gh release create android-v2.6.35 --draft --target "$GITHUB_SHA" --title 'Luka Companion 2.6.35 — Android' --notes-file release-notes.txt
          fi
          gh release upload android-v2.6.35 dist/Luka-2.6.35-Android.apk dist/android-update.json dist/SHA256SUMS.txt --clobber
          mkdir -p verified
          gh release download android-v2.6.35 --dir verified
          python - <<'PY'
          import hashlib,json,pathlib
          for name in ['Luka-2.6.35-Android.apk','android-update.json','SHA256SUMS.txt']:
              assert pathlib.Path('dist',name).read_bytes()==pathlib.Path('verified',name).read_bytes(),name
          feed=json.loads(pathlib.Path('verified/android-update.json').read_text())
          assert hashlib.sha256(pathlib.Path('verified/Luka-2.6.35-Android.apk').read_bytes()).hexdigest()==feed['sha256']
          print('Draft APK, manifest and checksum exactly match validated files.')
          PY
      - name: Publish release and select it as latest
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name | grep -Fx android-v2.6.33
          gh release edit android-v2.6.35 --draft=false --prerelease=false --latest --notes-file release-notes.txt
      - name: Verify anonymous update feed and APK download
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          expected=json.loads(pathlib.Path('dist/android-update.json').read_text())
          url='https://github.com/nama19920-glitch/luka-android-releases/releases/latest/download/android-update.json'
          for attempt in range(8):
              try:
                  request=urllib.request.Request(url+'?verify=2635-'+str(time.time_ns()),headers={'User-Agent':'Luka-Android/2.6.33','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=30) as response: actual=json.load(response)
                  if actual==expected: break
              except Exception:
                  if attempt==7: raise
              if attempt==7: raise AssertionError('Public feed does not match the new release')
              time.sleep(5)
          with urllib.request.urlopen(actual['url'],timeout=60) as response: apk=response.read()
          assert len(apk)==actual['sizeBytes'] and hashlib.sha256(apk).hexdigest()==actual['sha256']
          print('Public version 2.6.35 (306) is available anonymously; latest update feed and APK agree.')
          PY
